<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>harry.crawford /security-research</title>
        <!--
          GitHub Pages serves this file for any URL that doesn't match a
          static file (e.g. a direct link to /posts/some-slug). It encodes
          the requested path into a query string and redirects to the SPA's
          index.html, which decodes it back into a real URL (see the inline
          script in index.html) so React Router can render the right page.
          https://github.com/rafgraph/spa-github-pages
        -->
        <script type="text/javascript">
            var pathSegmentsToKeep = 0;
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        </script>
    </head>

</html>
